<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Lista</title>
    <link rel="stylesheet" href="style (2).css">
</head>
<body>

    <div class="navbar">
        <div class="nav-container">
            <div class="logo">
                <h2>galeria de pinturas</h2>
            </div>
        </div>
    </div>

    <section class="hero">
        <h1>galeria</h1>
        <p>Página criada para que  pessoas possam armazenar e salvar as fotos de de pinturas e fazer descrições sobre o que acham, pensam ou sentem sobre elas.</p>
    </section>

    <main>

        <div class="formulario">

            <label for="titulo">Título</label>
            <input type="text" id="titulo" placeholder="Digite o título">

            <label for="descricao">Descrição</label>
            <input type="text" id="descricao" placeholder="Digite a descrição">

            <label for="imagem">Imagem</label>
            <input type="file" id="imagem">

            <button id="adicionar">Adicionar</button>

        </div>

        <div id="lista"></div>

    </main>

    <footer>
        <div class="container">
            <p>
                ETECVAV • 2026<br>
                Página desenvolvida por: Helena bianquini Carriço e Bianca Rocha do Nascimento.
            </p>
        </div>
    </footer>

    <script src="script.js"></script>

</body>
</html>
